# ---- help ----
helpHtml=<h3>How Bolt works</h3><p>This app replaces the Bolt Console web app. It runs in the SAP system that holds the Smart Forms - there is nothing to download or upload by hand.</p><ol><li><strong>Smart Forms</strong> - every custom Smart Form of this system. Select the ones to migrate and choose <em>Next</em>, then <em>Commit</em>. Each form gets a serial number and its own GitHub branch; the legacy grab, the driver sources, the Smart Form XML and the Smart Styles it uses are produced here and sent to the branch automatically.</li><li><strong>Migration</strong> - every committed form with its live status. Open one to see the full log and to answer the migration engineer: <em>I've done this - confirm</em> after a manual step (for example pulling an object with abapGit), or report a problem, ask a question, request a change, raise a concern - with files attached if needed. You can stop a migration at any time and resume it.</li><li><strong>Re-process</strong> - a stopped form can be selected again on the Smart Forms tab. It starts over on a new branch with freshly produced files; the stopped run is closed.</li><li><strong>Configuration</strong> - the GitHub connection, the AI provider, the target repository and the global reference library. Only Bolt administrators can change it.</li></ol><h3>What is kept in SAP</h3><p>The basic status of every migration (serial number, status, who it is waiting on, stop, dates, files) and a status history, so progress can be analysed at any time. The messages themselves stay in the status file on the migration's branch, which is the one place both sides read.</p><h3>What the client provides</h3><p>A GitHub repository and a token with Contents read/write on it, outbound HTTPS from this system to api.github.com (root certificate in STRUST), and - optional - an AI provider key. See the connectivity guide in the repository (docs/03_client_connectivity.md).</p>
