# help
helpHtml=<h3>How Bolt with Fiori works</h3>\
<p>The same process as the Bolt web console - without downloading or uploading any legacy files.</p>\
<ol>\
<li><strong>Configuration</strong> - an administrator connects the SAP source systems (DEV, QA, PRD), GitHub and, optionally, an AI provider, and runs each <em>Test connection</em>. The header shows <strong>LIVE</strong> when all three are connected.</li>\
<li><strong>Smart Forms Overview</strong> - choose the source system. Every custom Smart Form of that system is listed. Forms already in migration show their number and status and cannot be selected again.</li>\
<li>Select the forms, press <strong>Next</strong>, check the list and press <strong>Commit selection</strong>. Each form gets a serial number and is sent to GitHub: its legacy grab, its Smart Form XML and its driver program sources, on a new branch with its status file.</li>\
<li><strong>Migration</strong> - follow every migration. When a migration is <em>waiting on you</em>, open it, do the SAP step described in the note (for example: create the empty form in SFP, pull with abapGit, activate, preview) and press <strong>I've done this - confirm</strong>, or report a problem. The engineer continues only after your answer is recorded.</li>\
<li>Use <strong>Stop</strong> to pause a migration, <strong>Raise a concern</strong> at any time - also after completion.</li>\
</ol>\
<p>Everything you send is written to the migration's status file on its own GitHub branch - the single point of contact with the engineer. The full log is also kept in SAP.</p>\
<p>The step-by-step operator checklist and the GitHub connectivity guide are in the project documentation (docs folder of the Bolt with Fiori repository).</p>
