tokenHelp=On github.com: Settings > Developer settings > Personal access tokens > Fine-grained tokens > Generate new token.\n\n1. Resource owner: the account or organization that owns the client repository.\n2. Repository access: Only select repositories > the client repository.\n3. Permissions > Repository permissions > Contents: Read and write (Metadata: Read-only is added automatically).\n4. To let this page create the repository, also give Administration: Read and write on all repositories - or create the repository on GitHub yourself.\n5. Generate, copy the token and paste it here.\n\nA classic token with the "repo" scope works too.
