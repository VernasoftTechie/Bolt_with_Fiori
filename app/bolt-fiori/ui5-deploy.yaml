specVersion: "3.1"
metadata:
  name: vernasoft.boltfiori
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://REPLACE-WITH-YOUR-S4-HOST:PORT
          client: "REPLACE-CLIENT"
        credentials:
          username: env:ABAP_USER
          password: env:ABAP_PASSWORD
        app:
          name: ZSFTAD_BOLT
          package: ZSFTAD_BOLT
          transport: REPLACE-WITH-TRANSPORT
          description: "Bolt - Smart Form to Adobe migration console"
        exclude:
          - /test/
